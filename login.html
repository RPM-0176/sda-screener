<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDA Property Screener — Login</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#001540 0%,#002060 50%,#003090 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:16px;padding:40px 40px 32px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,0.4)}
  .logo{text-align:center;margin-bottom:28px}
  .logo img{height:72px;width:auto;margin-bottom:14px}
  .logo h1{font-size:18px;font-weight:700;color:#002060;margin-bottom:2px;letter-spacing:0.2px}
  .logo p{font-size:12px;color:#6B7280}
  .divider{height:1px;background:#e5e7eb;margin-bottom:24px}
  label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  input{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;font-family:Arial;margin-bottom:16px;color:#111827;transition:border-color .2s}
  input:focus{outline:none;border-color:#185FA5;box-shadow:0 0 0 3px rgba(24,95,165,.12)}
  button{width:100%;padding:14px;background:#002060;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;transition:background .2s}
  button:hover{background:#003090}
  .error{background:#fff3f3;border:1px solid #fca5a5;color:#A32D2D;padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
  .fineprint{margin-top:28px;padding-top:18px;border-top:1px solid #e5e7eb;font-size:10px;color:#9CA3AF;line-height:1.5;text-align:center}
  .fineprint strong{color:#6B7280}
</style>
